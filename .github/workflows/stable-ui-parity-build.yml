name: Stable UI Parity Test Build

on:
  push:
    branches: [stable-ui-parity-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Convert exact Beta UI source to Stable identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('source code')
          src = root / 'src'

          # Stable namespace/package conversion while keeping the exact Beta UI code.
          for p in src.rglob('*.java'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('com.harleytg.forum.dev', 'com.harleytg.forum')
              p.write_text(s, encoding='utf-8')

          manifest = root / 'AndroidManifest.xml'
          s = manifest.read_text(encoding='utf-8')
          s = s.replace('com.harleytg.forum.dev', 'com.harleytg.forum')
          s = re.sub(r'android:versionCode="[0-9]+"', 'android:versionCode="10000076"', s, count=1)
          s = re.sub(r'android:versionName="[^"]+"', 'android:versionName="1.0 (10000076)"', s, count=1)
          s = s.replace('android:value="dev"', 'android:value="stable"')
          s = s.replace('android:value="1.0 (10000072)"', 'android:value="1.0 (10000076)"')
          s = s.replace('android:value="10000072"', 'android:value="10000076"')
          manifest.write_text(s, encoding='utf-8')

          # Stable branding and public UI wording. Keep the Beta UI structure/layout unchanged.
          replacements = [
              ("Harley's Clan Forum v1.0 [Development Build / Beta]", "Harley's Clan Forum v1.0 [Stable]"),
              ("Harley's Clan Forum [Beta]", "Harley's Clan Forum"),
              ("Development / Beta", "Stable"),
              ("Development/Beta", "Stable"),
              ("Development and Beta", "Stable"),
              ("Beta/Dev", "Stable"),
              ("Beta test alerts", "notification tools"),
              ("Beta Update Available", "Stable Update Available"),
              ("Beta update available", "Stable update available"),
              ("Beta update", "Stable update"),
              ("Beta build", "Stable build"),
              ("Beta APK", "Stable APK"),
              ("Dev/Beta-only", "Internal"),
              ("Beta-only", "Internal"),
              ("Development-only", "Internal"),
              ("Preview Releases", "Official Releases"),
              ("development build", "Stable build"),
          ]
          for p in list(src.rglob('*.java')) + list((root / 'res').rglob('*.xml')):
              text = p.read_text(encoding='utf-8')
              for a, b in replacements:
                  text = text.replace(a, b)
              p.write_text(text, encoding='utf-8')

          # BuildInfo: Stable-only runtime identity and next installable test version.
          bi = src / 'com/harleytg/forum/dev/BuildInfo.java'
          text = bi.read_text(encoding='utf-8')
          text = re.sub(r'static final String APK_FILE_NAME = ".*?";', 'static final String APK_FILE_NAME = "HCF-Stable-v10000076.apk";', text)
          text = re.sub(r'static final String CHANNEL = ".*?";', 'static final String CHANNEL = "Stable";', text)
          text = re.sub(r'static final String DEFAULT_UPDATE_CHANNEL = ".*?";', 'static final String DEFAULT_UPDATE_CHANNEL = "stable";', text)
          text = re.sub(r'static final String DEVELOPMENT_BUILD_LABEL = ".*?";', 'static final String DEVELOPMENT_BUILD_LABEL = "Harley\'s Clan Forum v1.0 [Stable]";', text)
          text = re.sub(r'static final boolean ENABLE_DEV_TEST_MENU = (true|false);', 'static final boolean ENABLE_DEV_TEST_MENU = false;', text)
          text = re.sub(r'static final String META_LINE = ".*?";', 'static final String META_LINE = "1.0 • Stable";', text)
          text = re.sub(r'static final String VERSION_BUILD_LINE = ".*?";', 'static final String VERSION_BUILD_LINE = "1.0 • Stable • UI Parity Test";', text)
          text = re.sub(r'static final int VERSION_CODE = [0-9]+;', 'static final int VERSION_CODE = 10000076;', text)
          bi.write_text(text, encoding='utf-8')

          # Force automated/native update entry points to Stable. Channel switching remains disabled.
          ua = src / 'com/harleytg/forum/dev/UpdateAutomation.java'
          t = ua.read_text(encoding='utf-8').replace('final String str = "dev";', 'final String str = "stable";').replace('UpdateChecker.check(applicationContext, "dev"', 'UpdateChecker.check(applicationContext, "stable"')
          ua.write_text(t, encoding='utf-8')

          main = src / 'com/harleytg/forum/dev/MainActivity.java'
          t = main.read_text(encoding='utf-8').replace('UpdateChecker.check(this, "dev"', 'UpdateChecker.check(this, "stable"')
          t = t.replace('Channel: Development / Beta', 'Channel: Stable').replace('Checking Development / Beta updates…', 'Checking Stable updates…').replace('Development / Beta feed', 'Stable feed')
          main.write_text(t, encoding='utf-8')

          settings = src / 'com/harleytg/forum/dev/SettingsActivity.java'
          t = settings.read_text(encoding='utf-8')
          t = t.replace('return "dev";', 'return "stable";')
          t = t.replace('prefs.getString("update_channel", "dev")', 'prefs.getString("update_channel", "stable")')
          t = t.replace('"Channel: Dev • Update feed: dev', '"Channel: Stable • Update feed: stable')
          t = t.replace('Channel: Dev / dev', 'Channel: Stable / stable').replace('Channel: Dev', 'Channel: Stable').replace('channel Dev • update feed dev', 'channel Stable • update feed stable')
          settings.write_text(t, encoding='utf-8')

          telem = src / 'com/harleytg/forum/dev/TelemetryService.java'
          t = telem.read_text(encoding='utf-8').replace('jSONObject.put("channel", "Dev")', 'jSONObject.put("channel", "Stable")').replace('optString("channel", "Dev")', 'optString("channel", "Stable")')
          telem.write_text(t, encoding='utf-8')

          # Keep source path as-is; Java package declarations now compile into com.harleytg.forum.
          PY

          # Stable must not expose Beta/Development branding in public layout/settings strings.
          ! grep -RInE 'Harley.s Clan Forum \[Beta\]|Development Build / Beta|Beta test alerts|Beta Update Available|development build is ready' "source code/res" "source code/src" || exit 21
          ! grep -RIn 'UpdateChecker.check(this, "dev"' "source code/src" || exit 22
          ! grep -RIn 'UpdateChecker.check(applicationContext, "dev"' "source code/src" || exit 23

      - name: Compile aligned unsigned Stable APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="source code"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/hcf-stable-ui"
          rm -rf "$WORK"
          mkdir -p "$WORK/gen" "$WORK/classes" "$WORK/dex" out

          "$BT/aapt" package -f -m \
            -J "$WORK/gen" \
            -M "$ROOT/AndroidManifest.xml" \
            -S "$ROOT/res" \
            -A "$ROOT/assets" \
            -I "$ANDROID_JAR" \
            -F "$WORK/resources.apk"

          mapfile -t JAVA_FILES < <(find "$WORK/gen" "$ROOT/src" -name '*.java' -print)
          javac --release 8 -classpath "$ANDROID_JAR" -d "$WORK/classes" "${JAVA_FILES[@]}"

          mapfile -t CLASS_FILES < <(find "$WORK/classes" -name '*.class' -print)
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --release --output "$WORK/dex" "${CLASS_FILES[@]}"

          cp "$WORK/resources.apk" "$WORK/unsigned.apk"
          (cd "$WORK/dex" && "$BT/aapt" add "$WORK/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$WORK/unsigned.apk" out/HCF-Stable-v10000076-UI-Parity-aligned-unsigned.apk
          "$BT/zipalign" -c -p 4 out/HCF-Stable-v10000076-UI-Parity-aligned-unsigned.apk

          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          "$BT/aapt" dump badging out/HCF-Stable-v10000076-UI-Parity-aligned-unsigned.apk | head -n 1 | tee out/badging.txt
          grep -q "name='com.harleytg.forum'" out/badging.txt
          grep -q "versionCode='10000076'" out/badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hcf-stable-ui-parity-v10000076
          path: |
            out/HCF-Stable-v10000076-UI-Parity-aligned-unsigned.apk
            out/apksigner.jar
            out/badging.txt
          if-no-files-found: error
          retention-days: 1
